# hello-world bundle patch: registers the hello_world tool plugin row.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field);
# install with:
#   dsh plugin --profile web add link:<repo>/packages/hello-world
# or from npm once published:
#   dsh plugin --profile web add @dsh-my-plugin/hello-world
- insert:
    - id: hello-world
      name: '@dsh-my-plugin/hello-world'
